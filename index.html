<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5a900" />
  <meta name="description" content="Editable thumbnail counter dashboard" />
  <title>Thumbnail Counter</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css?v=7" />
</head>
<body>
  <section id="authGate" class="auth-gate" aria-live="polite">
    <div class="auth-card">
      <img class="auth-logo" src="assets/logo.svg" alt="JL" />
      <p class="eyebrow">Private dashboard</p>
      <h1>Thumbnail Counter</h1>
      <p id="authIntro" class="auth-intro">Sign in to access your counters on any device.</p>

      <form id="loginForm" class="auth-form">
        <label>
          Email
          <input id="loginEmail" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input id="loginPassword" type="password" autocomplete="current-password" minlength="6" required />
        </label>
        <button class="toolbar-btn primary auth-submit" type="submit">Sign in</button>
        <button id="forgotPasswordBtn" class="auth-link auth-link-inline" type="button">Forgot password?</button>
      </form>

      <div id="externalAuth" class="external-auth">
        <div class="auth-divider" aria-hidden="true"><span>or</span></div>
        <button id="googleLoginBtn" class="google-login-btn" type="button">
          <svg class="google-login-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.39a4.61 4.61 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.97-4.33 2.97-7.41Z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.36l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22Z"/>
            <path fill="#FBBC05" d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.11-1.32.31-1.93V7.46H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.54l3.35-2.61Z"/>
            <path fill="#EA4335" d="M12 5.94c1.47 0 2.78.51 3.82 1.5l2.87-2.87A9.63 9.63 0 0 0 12 2 10 10 0 0 0 3.04 7.46l3.35 2.61C7.18 7.7 9.39 5.94 12 5.94Z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <form id="signupForm" class="auth-form" hidden>
        <label>
          Name
          <input id="signupName" type="text" autocomplete="name" maxlength="80" required />
        </label>
        <label>
          Email
          <input id="signupEmail" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button class="toolbar-btn primary auth-submit" type="submit">Create account</button>
      </form>

      <form id="recoveryForm" class="auth-form" hidden>
        <label>
          Account email
          <input id="recoveryEmail" type="email" autocomplete="email" required />
        </label>
        <button class="toolbar-btn primary auth-submit" type="submit">Send recovery email</button>
      </form>

      <form id="resetPasswordForm" class="auth-form" hidden>
        <label>
          New password
          <input id="resetPassword" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label>
          Confirm new password
          <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button class="toolbar-btn primary auth-submit" type="submit">Update password</button>
      </form>

      <form id="inviteForm" class="auth-form" hidden>
        <label>
          Create your password
          <input id="invitePassword" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label>
          Confirm password
          <input id="invitePasswordConfirm" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button class="toolbar-btn primary auth-submit" type="submit">Accept invitation</button>
      </form>

      <button id="toggleAuthModeBtn" class="auth-link" type="button">Create a new account</button>
      <p id="authMessage" class="auth-message"></p>
    </div>
  </section>

  <main id="appShell" class="app-shell" hidden>
    <header class="app-header">
      <div class="title-badge" aria-label="Application title">
        <span id="appTitle">THUMBNAIL COUNTER</span>
      </div>

      <div class="toolbar" aria-label="Counter controls">
        <button id="addCounterBtn" class="toolbar-btn primary" type="button">+ Add counter</button>
        <button id="editModeBtn" class="toolbar-btn" type="button" aria-pressed="false">Edit mode</button>
        <button id="resetAllBtn" class="toolbar-btn danger" type="button">Reset all</button>
        <button id="exportBtn" class="toolbar-btn" type="button">Export</button>
        <label class="toolbar-btn file-btn" for="importInput">Import</label>
        <input id="importInput" type="file" accept="application/json" hidden />
      </div>

      <div class="user-bar" aria-label="Current user">
        <span id="currentUserName"></span>
        <button id="logoutBtn" class="toolbar-btn compact" type="button">Log out</button>
      </div>
    </header>

    <section class="status-row" aria-live="polite">
      <p id="summaryText">0 counters · 0 total</p>
      <p id="saveStatus">Saved automatically</p>
    </section>

    <section id="counterGrid" class="counter-grid counter-board" aria-label="Editable counters"></section>

    <section id="emptyState" class="empty-state" hidden>
      <h2>No counters yet</h2>
      <p>Create your first counter and start tracking.</p>
      <button id="emptyAddBtn" class="toolbar-btn primary" type="button">Create counter</button>
    </section>
  </main>

  <dialog id="counterDialog" class="counter-dialog">
    <form id="counterForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">Counter settings</p>
          <h2 id="dialogTitle">Add counter</h2>
        </div>
        <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="Close dialog">×</button>
      </div>

      <input id="counterId" type="hidden" />

      <label>
        Name
        <input id="counterName" type="text" maxlength="26" placeholder="Example: SIXRING" required />
      </label>

      <div class="form-grid">
        <label>
          Goal
          <input id="counterGoal" type="number" min="0" step="1" value="10" required />
        </label>

        <label>
          Current value
          <input id="counterValue" type="number" min="0" step="1" value="0" required />
        </label>
      </div>

      <label>
        Accent color
        <input id="counterColor" type="color" value="#f5a900" />
      </label>

      <div class="dialog-actions">
        <button id="cancelDialogBtn" class="toolbar-btn" type="button">Cancel</button>
        <button class="toolbar-btn primary" type="submit">Save counter</button>
      </div>
    </form>
  </dialog>

  <template id="counterCardTemplate">
    <article class="counter-card">
      <div class="counter-card__screen">
        <div class="counter-card__topline">
          <h2 class="counter-card__title"></h2>
          <button class="card-edit-btn" type="button" aria-label="Edit counter">✎</button>
        </div>
        <p class="counter-card__value" aria-live="polite"></p>
        <div class="progress-track" aria-hidden="true">
          <span class="progress-bar"></span>
        </div>
      </div>

      <div class="counter-card__controls">
        <button class="count-btn minus-btn" type="button" aria-label="Decrease counter">−</button>
        <button class="count-btn plus-btn" type="button" aria-label="Increase counter">+</button>
      </div>

      <div class="counter-card__edit-actions">
        <button class="small-action duplicate-btn" type="button">Duplicate</button>
        <button class="small-action delete-btn" type="button">Delete</button>
      </div>
    </article>
  </template>

  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
